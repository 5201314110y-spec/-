# AGP 7+ requires explicit opt-in for AndroidX.
android.useAndroidX=true
# Keep legacy support-library artifacts (if any transitively pulled) rewritten to androidx.
android.enableJetifier=true

# Build performance / stability
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Avoid noisy non-final resource IDs warning on AGP 7.x
android.nonTransitiveRClass=true
