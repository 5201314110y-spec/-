name: Build APK

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_version:
        description: '可选：填写版本号 (如 v1.0.0) 即创建同名 tag 并发布 GitHub Release。留空则只生成 artifact。'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace --info

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
            app/build/outputs/logs/
            **/*.log
          if-no-files-found: ignore

      - name: Resolve release version
        id: rel
        run: |
          version=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.release_version }}" ]; then
            version="${{ inputs.release_version }}"
          elif [ -f VERSION ]; then
            version="$(tr -d ' \r\n\t' < VERSION)"
          fi
          if [ -n "$version" ] && [[ ! "$version" =~ ^v ]]; then
            version="v${version}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -n "$version" ]; then
            echo "Will release as: $version"
          else
            echo "No release version configured; building artifact only."
          fi

      - name: Stage APK
        id: apk
        env:
          VERSION: ${{ steps.rel.outputs.version }}
        run: |
          label="${VERSION:-${GITHUB_REF_NAME//\//-}}"
          mkdir -p dist
          out="dist/car-music-${label}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: car-music-debug-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Skip release if tag already exists
        if: steps.rel.outputs.version != ''
        id: tagcheck
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.rel.outputs.version }}
        run: |
          if gh api "repos/${{ github.repository }}/releases/tags/$TAG" >/dev/null 2>&1; then
            echo "Release for $TAG already exists; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: steps.rel.outputs.version != '' && steps.tagcheck.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.version }}
          name: ${{ steps.rel.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/*.apk
          generate_release_notes: true
