name: Build APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_version:
        description: '可选：填写版本号 (如 v1.0.0) 即创建同名 tag 并发布 GitHub Release。留空则只生成 artifact。'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Compute APK name
        id: apk
        run: |
          if [ -n "${{ inputs.release_version }}" ]; then
            label="${{ inputs.release_version }}"
          else
            label="${GITHUB_REF_NAME//\//-}"
          fi
          mkdir -p dist
          out="dist/car-music-${label}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"
          echo "label=$label" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: car-music-debug-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Create tag for manual release
        if: github.event_name == 'workflow_dispatch' && inputs.release_version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_version }}
        run: |
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists locally, skipping create."
          elif gh api "repos/${{ github.repository }}/git/refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists on remote, skipping create."
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

      - name: Create GitHub Release (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true

      - name: Create GitHub Release (manual dispatch)
        if: github.event_name == 'workflow_dispatch' && inputs.release_version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_version }}
          name: ${{ inputs.release_version }}
          files: dist/*.apk
          generate_release_notes: true
