<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>车载音乐</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1db954">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #0d0d0d; --surface: #1a1a1a; --surface2: #252525;
  --primary: #1db954; --primary-dim: #158f3f;
  --text: #ffffff; --text2: #b3b3b3; --text3: #666;
  --radius: 14px; --gap: 12px;
}
html, body { height: 100%; overflow: hidden; }
body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg); color: var(--text);
  display: flex; flex-direction: column;
}

/* 顶栏 */
.topbar {
  display: flex; flex-direction: column; gap: 10px;
  padding: 16px 16px 12px; background: var(--surface);
  border-bottom: 1px solid #333; flex-shrink: 0;
}
.topbar-row1 {
  display: flex; align-items: center; gap: 12px;
}
.topbar h1 { font-size: 20px; font-weight: 600; white-space: nowrap; }
.topbar h1 span { color: var(--primary); }

.search-box {
  flex: 1; display: flex; align-items: center;
  background: var(--surface2); border-radius: 30px;
  padding: 0 16px;
}
.search-box input {
  flex: 1; border: none; outline: none; background: transparent;
  color: var(--text); font-size: 16px; padding: 12px 8px;
}
.search-box input::placeholder { color: var(--text3); }
.search-box button {
  background: var(--primary); border: none; border-radius: 50%;
  width: 40px; height: 40px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.search-box button svg { width: 20px; height: 20px; fill: #fff; }

.source-select {
  display: flex; gap: 6px; flex-wrap: wrap;
}
.source-btn {
  padding: 8px 14px; border-radius: 18px; border: 1px solid #444;
  background: transparent; color: var(--text2); font-size: 13px;
  cursor: pointer; transition: all .2s;
}
.source-btn.active { background: var(--primary); border-color: var(--primary); color: #fff; }

/* 主体 - 歌曲列表 */
.song-list {
  flex: 1; overflow-y: auto; padding: 12px 16px;
  scrollbar-width: thin; scrollbar-color: #444 transparent;
}
.song-list::-webkit-scrollbar { width: 4px; }
.song-list::-webkit-scrollbar-thumb { background: #444; border-radius: 2px; }

.song-item {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px; border-radius: var(--radius);
  cursor: pointer; transition: background .15s;
  margin-bottom: 4px;
}
.song-item:hover, .song-item:active { background: var(--surface2); }
.song-item.playing { background: var(--surface2); border-left: 4px solid var(--primary); }

.song-item .cover {
  width: 52px; height: 52px; border-radius: 8px;
  object-fit: cover; background: #333; flex-shrink: 0;
}
.song-item .info { flex: 1; min-width: 0; }
.song-item .info .name {
  font-size: 16px; font-weight: 500;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.song-item .info .artist {
  font-size: 13px; color: var(--text2); margin-top: 3px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.song-item .meta {
  font-size: 12px; color: var(--text3); text-align: right; flex-shrink: 0;
}
.song-item .source-tag {
  font-size: 10px; background: var(--surface); padding: 2px 7px;
  border-radius: 8px; color: var(--text2);
}

/* 播放器底栏 - 竖屏适配 */
.player-bar {
  display: flex; flex-direction: column; gap: 8px;
  padding: 12px 16px 20px; background: var(--surface);
  border-top: 1px solid #333; flex-shrink: 0;
}
.player-now {
  display: flex; align-items: center; gap: 12px;
}
.player-bar .now-cover {
  width: 50px; height: 50px; border-radius: 8px;
  object-fit: cover; background: #333; flex-shrink: 0;
}
.player-bar .now-info { flex: 1; min-width: 0; }
.player-bar .now-info .name {
  font-size: 15px; font-weight: 500;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.player-bar .now-info .artist {
  font-size: 12px; color: var(--text2); margin-top: 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

.player-controls {
  display: flex; align-items: center; justify-content: center; gap: 12px;
}
.ctrl-btn {
  width: 48px; height: 48px; border-radius: 50%;
  border: none; background: transparent; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background .15s;
}
.ctrl-btn:hover { background: var(--surface2); }
.ctrl-btn svg { width: 26px; height: 26px; fill: var(--text); }
.ctrl-btn.play-btn {
  width: 60px; height: 60px; background: var(--primary);
}
.ctrl-btn.play-btn:hover { background: var(--primary-dim); }
.ctrl-btn.play-btn svg { width: 30px; height: 30px; fill: #fff; }

.progress-area {
  display: flex; align-items: center; gap: 10px;
}
.progress-bar {
  flex: 1; height: 6px; background: #333; border-radius: 3px;
  cursor: pointer; position: relative;
}
.progress-fill {
  height: 100%; background: var(--primary); border-radius: 3px;
  width: 0%; transition: width .3s linear;
}
.time-label { font-size: 12px; color: var(--text3); white-space: nowrap; min-width: 38px; }

/* 歌词弹窗 */
.lyric-btn {
  width: 48px; height: 48px; border-radius: 50%;
  border: none; background: transparent; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.lyric-btn svg { width: 22px; height: 22px; fill: var(--text2); }
.lyric-btn.active svg { fill: var(--primary); }

.lyric-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.92); z-index: 100;
  display: none; flex-direction: column;
  padding: 40px 24px; overflow-y: auto;
}
.lyric-overlay.show { display: flex; }
.lyric-overlay .close-btn {
  position: absolute; top: 16px; right: 16px;
  width: 40px; height: 40px; border-radius: 50%;
  border: none; background: var(--surface2); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.lyric-overlay .close-btn svg { width: 20px; height: 20px; fill: var(--text); }
.lyric-line {
  font-size: 18px; color: var(--text3); padding: 10px 0;
  text-align: center; transition: all .3s;
}
.lyric-line.active { color: var(--primary); font-size: 22px; font-weight: 600; }

/* 空状态 */
.empty-state {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; height: 100%; color: var(--text3);
}
.empty-state svg { width: 64px; height: 64px; fill: #333; margin-bottom: 12px; }
.empty-state p { font-size: 16px; }

/* 加载 */
.loading { text-align: center; padding: 40px; color: var(--text3); font-size: 15px; }
.loading::after {
  content: ''; display: inline-block; width: 18px; height: 18px;
  border: 2px solid var(--primary); border-top-color: transparent;
  border-radius: 50%; animation: spin .8s linear infinite;
  margin-left: 8px; vertical-align: middle;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- 顶栏 -->
<div class="topbar">
  <div class="topbar-row1">
    <h1>🚗 <span>车载音乐</span></h1>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="搜索歌曲、歌手..." autocomplete="off">
      <button onclick="doSearch()" aria-label="搜索">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      </button>
    </div>
  </div>
  <div class="source-select">
    <button class="source-btn active" data-source="netease">网易</button>
    <button class="source-btn active" data-source="qq">QQ</button>
    <button class="source-btn active" data-source="kugou">酷狗</button>
    <button class="source-btn active" data-source="kuwo">酷我</button>
    <button class="source-btn" data-source="migu">咪咕</button>
    <button class="source-btn" data-source="bilibili">B站</button>
  </div>
</div>

<!-- 歌曲列表 -->
<div class="song-list" id="songList">
  <div class="empty-state">
    <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
    <p>搜索你想听的音乐</p>
  </div>
</div>

<!-- 歌词浮层 -->
<div class="lyric-overlay" id="lyricOverlay">
  <button class="close-btn" onclick="toggleLyric()">
    <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
  </button>
  <div id="lyricContent"></div>
</div>

<!-- 播放器底栏 -->
<div class="player-bar">
  <div class="player-now">
    <img class="now-cover" id="nowCover" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 50 50'%3E%3Crect fill='%23333' width='50' height='50'/%3E%3C/svg%3E" alt="">
    <div class="now-info">
      <div class="name" id="nowName">未在播放</div>
      <div class="artist" id="nowArtist">-</div>
    </div>
    <button class="lyric-btn" id="lyricBtn" onclick="toggleLyric()" aria-label="歌词">
      <svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm-1 9h-2v2H9v-2H7V9h2V7h2v2h2v2zm3-3.5V9h-1V5.5L16 7.5zM6 20V4h7v5h5v11H6z"/></svg>
    </button>
  </div>
  <div class="progress-area">
    <span class="time-label" id="timeCurrent">0:00</span>
    <div class="progress-bar" id="progressBar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <span class="time-label" id="timeTotal">0:00</span>
  </div>
  <div class="player-controls">
    <button class="ctrl-btn" onclick="playPrev()" aria-label="上一首">
      <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
    </button>
    <button class="ctrl-btn play-btn" id="playBtn" onclick="togglePlay()" aria-label="播放">
      <svg id="iconPlay" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      <svg id="iconPause" viewBox="0 0 24 24" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
    </button>
    <button class="ctrl-btn" onclick="playNext()" aria-label="下一首">
      <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
    </button>
  </div>
</div>

<audio id="audio" preload="auto"></audio>

<script>
const API_BASE = "https://music.zkkp.nyc.mn/music";
const HEADERS = { "X-Requested-With": "XMLHttpRequest" };

let playlist = [];
let currentIndex = -1;
let lyrics = [];

const audio = document.getElementById("audio");
const searchInput = document.getElementById("searchInput");

// --- 搜索 ---
function getSelectedSources() {
  return Array.from(document.querySelectorAll(".source-btn.active")).map(function(b){ return b.dataset.source; });
}

document.querySelectorAll(".source-btn").forEach(function(btn) {
  btn.addEventListener("click", function() { btn.classList.toggle("active"); });
});

searchInput.addEventListener("keydown", function(e) {
  if (e.key === "Enter") doSearch();
});

async function doSearch() {
  var q = searchInput.value.trim();
  if (!q) return;

  var sources = getSelectedSources();
  if (sources.length === 0) { alert("请至少选择一个搜索源"); return; }

  var listEl = document.getElementById("songList");
  listEl.innerHTML = '<div class="loading">搜索中</div>';

  var params = new URLSearchParams({ q: q, type: "song", page: "1", page_size: "50" });
  sources.forEach(function(s){ params.append("sources", s); });

  try {
    var resp = await fetch(API_BASE + "/search?" + params, { headers: HEADERS });
    var html = await resp.text();
    var songs = parseSongCards(html);
    playlist = songs;
    renderList(songs);
  } catch (e) {
    listEl.innerHTML = '<div class="empty-state"><p>搜索失败，请重试</p></div>';
  }
}

function parseSongCards(html) {
  var songs = [];
  var regex = /<li\s+class="song-card"\s+([\s\S]*?)>/g;
  var m;
  while ((m = regex.exec(html)) !== null) {
    var attrs = m[1];
    var song = {};
    var attrRe = /data-([\w-]+)=["']([^"']*?)["']/g;
    var am;
    while ((am = attrRe.exec(attrs)) !== null) {
      var key = am[1].replace(/-/g, "_");
      var val = am[2].replace(/&#34;/g, '"').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>');
      song[key] = val;
    }
    if (song.duration) song.duration = parseInt(song.duration) || 0;
    if (song.extra) { try { song.extra = JSON.parse(song.extra); } catch(e) {} }
    if (song.id) songs.push(song);
  }
  return songs;
}

function renderList(songs) {
  var listEl = document.getElementById("songList");
  if (songs.length === 0) {
    listEl.innerHTML = '<div class="empty-state"><p>未找到结果</p></div>';
    return;
  }
  listEl.innerHTML = songs.map(function(s, i) {
    return '<div class="song-item ' + (i === currentIndex ? 'playing' : '') + '" onclick="playSong(' + i + ')">' +
      '<img class="cover" src="' + (s.cover || 'data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 52 52%27%3E%3Crect fill=%27%23333%27 width=%2752%27 height=%2752%27/%3E%3C/svg%3E') + '" alt="" loading="lazy" onerror="this.src=\'data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 52 52%27%3E%3Crect fill=%27%23333%27 width=%2752%27 height=%2752%27/%3E%3C/svg%3E\'">' +
      '<div class="info"><div class="name">' + escHTML(s.name) + '</div>' +
      '<div class="artist">' + escHTML(s.artist) + ' · ' + escHTML(s.album || '') + '</div></div>' +
      '<div class="meta"><span class="source-tag">' + s.source + '</span>' +
      '<div style="margin-top:3px">' + formatTime(s.duration) + '</div></div></div>';
  }).join("");
}

// --- 播放 ---
async function playSong(index) {
  if (index < 0 || index >= playlist.length) return;
  currentIndex = index;
  var song = playlist[index];

  document.getElementById("nowName").textContent = song.name;
  document.getElementById("nowArtist").textContent = song.artist;
  if (song.cover) document.getElementById("nowCover").src = song.cover;

  renderList(playlist);

  var params = new URLSearchParams({ id: song.id, source: song.source, duration: String(song.duration || 0) });
  if (song.extra && typeof song.extra === "object") {
    params.set("extra", JSON.stringify(song.extra));
  } else if (song.extra && typeof song.extra === "string") {
    params.set("extra", song.extra);
  }

  try {
    var resp = await fetch(API_BASE + "/inspect?" + params, { headers: HEADERS });
    var data = await resp.json();
    if (data.valid && data.url) {
      audio.src = data.url;
      audio.play();
      showPlaying(true);
      loadLyrics(song.id, song.source);
    } else {
      alert("该歌曲暂时无法播放");
    }
  } catch (e) {
    alert("获取播放地址失败");
  }
}

function togglePlay() {
  if (audio.paused) { audio.play(); showPlaying(true); }
  else { audio.pause(); showPlaying(false); }
}
function playPrev() { if (currentIndex > 0) playSong(currentIndex - 1); }
function playNext() { if (currentIndex < playlist.length - 1) playSong(currentIndex + 1); }

function showPlaying(playing) {
  document.getElementById("iconPlay").style.display = playing ? "none" : "block";
  document.getElementById("iconPause").style.display = playing ? "block" : "none";
}

// --- 进度 ---
audio.addEventListener("timeupdate", function() {
  if (!audio.duration) return;
  var pct = (audio.currentTime / audio.duration) * 100;
  document.getElementById("progressFill").style.width = pct + "%";
  document.getElementById("timeCurrent").textContent = formatTime(Math.floor(audio.currentTime));
  document.getElementById("timeTotal").textContent = formatTime(Math.floor(audio.duration));
  highlightLyric(audio.currentTime);
});
audio.addEventListener("ended", function() { playNext(); });
audio.addEventListener("pause", function() { showPlaying(false); });
audio.addEventListener("play", function() { showPlaying(true); });

document.getElementById("progressBar").addEventListener("click", function(e) {
  if (!audio.duration) return;
  var rect = e.currentTarget.getBoundingClientRect();
  var pct = (e.clientX - rect.left) / rect.width;
  audio.currentTime = pct * audio.duration;
});

// --- 歌词 ---
function toggleLyric() {
  var overlay = document.getElementById("lyricOverlay");
  overlay.classList.toggle("show");
  document.getElementById("lyricBtn").classList.toggle("active", overlay.classList.contains("show"));
}

async function loadLyrics(id, source) {
  try {
    var resp = await fetch(API_BASE + "/lyric?id=" + encodeURIComponent(id) + "&source=" + source, { headers: HEADERS });
    var text = await resp.text();
    lyrics = parseLRC(text);
    if (lyrics.length > 0) {
      document.getElementById("lyricContent").innerHTML = lyrics.map(function(l, i) {
        return '<div class="lyric-line" id="lrc' + i + '">' + (escHTML(l.text) || '···') + '</div>';
      }).join("");
    }
  } catch (e) { lyrics = []; }
}

function parseLRC(text) {
  var lines = [];
  text.split("\n").forEach(function(line) {
    var m = line.match(/\[(\d+):(\d+\.?\d*)\](.*)/);
    if (m) {
      var time = parseInt(m[1]) * 60 + parseFloat(m[2]);
      lines.push({ time: time, text: m[3].trim() });
    }
  });
  return lines.sort(function(a, b) { return a.time - b.time; });
}

function highlightLyric(currentTime) {
  if (lyrics.length === 0) return;
  var idx = 0;
  for (var i = lyrics.length - 1; i >= 0; i--) {
    if (currentTime >= lyrics[i].time) { idx = i; break; }
  }
  lyrics.forEach(function(_, i) {
    var el = document.getElementById("lrc" + i);
    if (el) {
      if (i === idx) { el.classList.add("active"); }
      else { el.classList.remove("active"); }
    }
  });
  var activeEl = document.getElementById("lrc" + idx);
  if (activeEl) activeEl.scrollIntoView({ behavior: "smooth", block: "center" });
}

// --- 工具 ---
function formatTime(sec) {
  if (!sec || sec < 0) return "0:00";
  var m = Math.floor(sec / 60);
  var s = Math.floor(sec % 60);
  return m + ":" + (s < 10 ? "0" : "") + s;
}
function escHTML(str) {
  if (!str) return "";
  return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

// === 车机语音助手桥接 ===
// Native → JS: 接收语音指令
window.nativeCommand = function(command, param) {
  switch (command) {
    case "togglePlay":
      togglePlay();
      break;
    case "pause":
      audio.pause();
      break;
    case "next":
      playNext();
      break;
    case "prev":
      playPrev();
      break;
    case "stop":
      audio.pause();
      audio.currentTime = 0;
      break;
    case "seekTo":
      var ms = parseInt(param) || 0;
      audio.currentTime = ms / 1000;
      break;
    case "voiceSearch":
      // 语音搜索：自动搜索并播放第一首
      if (param) {
        document.getElementById("searchInput").value = param;
        doSearch().then(function() {
          if (playlist.length > 0) {
            playSong(0);
          }
        });
      }
      break;
  }
};

// JS → Native: 同步播放状态给车机系统
(function() {
  var hasNative = typeof window.CarMusic !== "undefined";

  audio.addEventListener("play", function() {
    if (hasNative) {
      window.CarMusic.updatePlayState(true, Math.floor(audio.currentTime * 1000));
    }
  });
  audio.addEventListener("pause", function() {
    if (hasNative) {
      window.CarMusic.updatePlayState(false, Math.floor(audio.currentTime * 1000));
    }
  });
  audio.addEventListener("timeupdate", function() {
    // 每 2 秒同步一次位置，避免频繁调用
    if (hasNative && Math.floor(audio.currentTime) % 2 === 0) {
      window.CarMusic.updatePlayState(!audio.paused, Math.floor(audio.currentTime * 1000));
    }
  });

  // 覆写 playSong，在播放时通知 Native 元数据
  var _originalPlaySong = playSong;
  playSong = async function(index) {
    await _originalPlaySong(index);
    if (hasNative && currentIndex >= 0 && currentIndex < playlist.length) {
      var song = playlist[currentIndex];
      window.CarMusic.updateNowPlaying(
        song.name || "",
        song.artist || "",
        song.album || "",
        (song.duration || 0) * 1000
      );
    }
  };
})();
</script>
</body>
</html>
